<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRUEBA</title>
</head>
<body style="background:black; color:green; font-family:sans-serif; padding:20px;">

  <h1>PRUEBA DE BOTÓN</h1>
  
  <label>USUARIO:</label>
  <input type="text" id="u" value="Josetapias" style="padding:10px; font-size:18px; width:100%; margin:10px 0;">
  
  <label>CONTRASEÑA:</label>
  <input type="password" id="c" style="padding:10px; font-size:18px; width:100%; margin:10px 0;">
  
  <button onclick="entrar()" style="padding:15px; font-size:20px; background:lime; border:none; width:100%; cursor:pointer;">
    ✅ INGRESAR
  </button>
  
  <p id="msg" style="color:red; margin-top:15px;"></p>

  <script>
    function entrar() {
      const u = document.getElementById('u').value.trim();
      const c = document.getElementById('c').value.trim();
      
      if (u === "Josetapias" && c === "Mamita123") {
        document.body.innerHTML = "<h1 style='color:lime;'>✅ ENTRÓ BIEN!</h1><p>Funciona perfecto</p>";
      } else {
        document.getElementById('msg').textContent = "❌ Datos incorrectos: u="+u+" c="+c;
      }
    }
  </script>
</body>
